name: Ubuntu (gcc)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ubuntu-gcc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ccache: ON

jobs:
  ubuntu_gcc:
    strategy:
      matrix:
        mode: [ Debug ] #[Release, Debug]
        ssl: [ ON, OFF ]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.mode}}-ssl( ${{ matrix.ssl}} )
          append-timestamp: false

      - name: Configure
        run: |
          CXX=g++ CC=gcc 
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{matrix.mode}} -DBUILD_WITH_LIBCXX=${{matrix.libcxx}} -DYLT_ENABLE_SSL=${{matrix.ssl}} \
                -DUSE_CCACHE=${{env.ccache}} -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -j 2 -V

  ubuntu_gcc_tsan:
    strategy:
      matrix:
        mode: [ Debug ]
        ssl: [ ON ]
        # Network tests share fixed ports, so run HTTP on a separate runner.
        test_group: [ http, remaining ]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.mode}}-ssl( ${{ matrix.ssl}} )
          append-timestamp: false
          save: ${{ matrix.test_group == 'remaining' }}

      - name: Configure
        run: |
          CXX=g++ CC=gcc 
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{matrix.mode}} -DBUILD_WITH_LIBCXX=${{matrix.libcxx}} -DYLT_ENABLE_SSL=${{matrix.ssl}} \
                -DUSE_CCACHE=${{env.ccache}} -DENABLE_TSAN=ON -DBUILD_EXAMPLES=OFF

      - name: Build
        run: |
          if [ "${{ matrix.test_group }}" = "http" ]; then
            cmake --build ${{github.workspace}}/build --config ${{matrix.mode}} --target coro_http_test
          else
            cmake --build ${{github.workspace}}/build --config ${{matrix.mode}}
          fi

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: |
          if [ "${{ matrix.test_group }}" = "http" ]; then
            ctest -C ${{matrix.mode}} -R '^coro_http_test$' --no-tests=error -V
          else
            ctest -C ${{matrix.mode}} -E '^coro_http_test$' --no-tests=error -j 2 -V
          fi

  ubuntu_gcc_for_liburing:
    strategy:
      matrix:
        mode: [Release, Debug]
        io_uring: [ ON ]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.mode}}-ssl( ${{ matrix.ssl}} )
          append-timestamp: false

      - name: Configure
        run: |
          CXX=g++ CC=gcc 
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{matrix.mode}} \
                -DYLT_ENABLE_IO_URING=${{matrix.io_uring}} \
                -DUSE_CCACHE=${{env.ccache}} \
                -DBUILD_STRUCT_JSON=OFF -DBUILD_STRUCT_XML=OFF -DBUILD_STRUCT_PACK=OFF -DBUILD_STRUCT_YAML=OFF -DBUILD_UTIL=OFF

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -j 1 -V

  ubuntu_gcc9:
    strategy:
      matrix:
        # The runner's default GCC is used here; Debug is already covered by
        # ubuntu_gcc, so keep only the distinct Release build.
        mode: [ Release ]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ninja-build tool
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.mode}}
          append-timestamp: false

      - name: Configure
        run: |
          CXX=g++ CC=gcc
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{matrix.mode}} \
                -DUSE_CCACHE=${{env.ccache}} \

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.mode}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.mode}} -j 1 -V
