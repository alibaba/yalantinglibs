name: Own-ring file backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: own-ring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  own_ring:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        own_ring: [ 'ON', 'OFF' ]
        mode: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev libssl-dev ninja-build strace
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.mode }} \
            -DYLT_ENABLE_FILE_IO_URING=ON -DYLT_ENABLE_OWN_RING=${{ matrix.own_ring }} \
            -DBUILD_EXAMPLES=OFF -DBUILD_UNIT_TESTS=ON -DBUILD_BENCHMARK=ON \
            -DBUILD_CORO_HTTP=OFF -DBUILD_CORO_RPC=OFF -DBUILD_UTIL=OFF \
            -DBUILD_STRUCT_PACK=OFF -DBUILD_STRUCT_JSON=OFF \
            -DBUILD_STRUCT_XML=OFF -DBUILD_STRUCT_YAML=OFF
      - name: Build
        run: cmake --build build --target own_ring_test coro_io_test coro_file_error_test coro_file_bench -j2
      - name: Test backend and file compatibility
        run: |
          uname -a
          ulimit -a
          ctest --test-dir build -R '^coro_file_error_test$' --output-on-failure
          timeout 90s stdbuf -oL build/output/tests/own_ring_test --duration=true --no-colors=true
          strace -f -e trace=io_uring_setup,io_uring_register,openat,eventfd2 \
            -o build/file-compatibility.trace \
            build/output/tests/coro_io_test --test-case='*file*,*shared*' --duration=true --no-colors=true
          build/output/benchmark/coro_file_bench --operations 512 --repeats 1 --file-mib 8
      - name: Report file compatibility failures
        if: failure()
        run: |
          if test -f build/file-compatibility.trace; then
            grep -E '= -1|io_uring_setup' build/file-compatibility.trace | tail -100
          fi
      - name: Test downstream multi-translation-unit consumer
        run: |
          cmake -S src/coro_io/tests/own_ring_consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.mode }} \
            -DYLT_ENABLE_FILE_IO_URING=ON -DYLT_ENABLE_OWN_RING=${{ matrix.own_ring }}
          cmake --build build-consumer -j2
          ctest --test-dir build-consumer --output-on-failure
